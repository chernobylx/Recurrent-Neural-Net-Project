name: Portfolio restructure (one-shot)

on:
  push:
    branches:
      - claude/portfolio-repo-structure-sgbhhg

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whether restructure is still needed
        id: check
        run: |
          if [ -f "rnn-project (1).ipynb" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restructure notebook and extract figures
        if: steps.check.outputs.needed == 'true'
        run: python3 scripts/portfolio_restructure.py
      - name: Commit and push
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move notebook into notebooks/, clean it up, and extract report figures"
          git push
