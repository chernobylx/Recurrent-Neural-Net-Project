name: Portfolio restructure (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restructure notebook and extract figures
        run: python3 scripts/portfolio_restructure.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move notebook into notebooks/, clean it up, and extract report figures"
          git push
